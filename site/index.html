<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZudRisk</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="style.css?v=0.7.0">
</head>
<body>
<header>
  <h1><span data-t="title"></span> <span class="brand">ZudRisk</span></h1>
  <span class="sub" data-t="subtitle"></span>
  <span class="lbl" data-t="level"></span>
  <div class="seg" id="level" role="group"><button type="button" data-level="soum" aria-pressed="true"></button><button type="button" data-level="aimag" aria-pressed="false"></button><button type="button" data-level="zone" aria-pressed="false"></button></div>
  <label class="f-view"><span class="lbl" data-t="view"></span> <select id="view" autocomplete="off"><option value="risk"></option><option value="vuln"></option><option value="green"></option><option value="zone"></option><option value="decree"></option></select></label>
  <label class="f-winter"><span class="lbl" data-t="winter"></span> <select id="winter"></select></label>
  <input id="search" type="search" list="soums" autocomplete="off" aria-label="soum"><datalist id="soums"></datalist>
  <button id="lang" type="button">EN</button>
</header>
<aside>
  <div class="tabs" role="tablist">
    <button type="button" role="tab" data-tab-btn="map" data-t="tab_map"></button>
    <button type="button" role="tab" data-tab-btn="res" data-t="tab_res"></button>
    <button type="button" role="tab" data-tab-btn="how" data-t="tab_how"></button>
  </div>
  <section class="pane" data-tab="map">
  <p class="note sub-m" data-t="subtitle"></p>
  <div class="card" id="status"><b id="status_title"></b><p class="note" id="banner" hidden></p><button type="button" id="status_go"></button></div>
  <h2 data-t="legend"></h2>
  <p class="scale-row" id="scale_row" hidden><span id="scale_l"></span> <span class="seg" id="scale" role="group"><button type="button" data-scale="chance" aria-pressed="true"></button><button type="button" data-scale="class" aria-pressed="false"></button></span></p>
  <div class="legend" id="legend"></div>
  <p class="note" id="layer_note"></p>
  <h2 data-t="zone_table"></h2>
  <table id="zones" class="aimags"></table>
  <p class="note" id="zone_note"></p>
  <h2 data-t="aimags"></h2>
  <table id="aimags" class="aimags"></table>
  </section>
  <section class="pane" data-tab="res" hidden>
  <p class="intro" data-t="res_q"></p>
  <h2 id="validation_h"></h2>
  <table id="validation"></table>
  <p class="note" id="unit_note"></p>
  <p class="note" data-t="validation_note"></p>
  <h2 data-t="national"></h2>
  <div id="national_chart"></div>
  <h2 data-t="pooled"></h2>
  <table id="pooled"></table>
  <h2 data-t="stages"></h2>
  <div id="stages"></div>
  </section>
  <section class="pane" data-tab="how" hidden>
  <p class="intro" data-t="intro"></p>
  <h2 data-t="model"></h2>
  <table id="model_table"></table>
  <p class="note" id="model_note"></p>
  <h2 data-t="model_by_winter"></h2>
  <div id="model_chart"></div>
  <h2 data-t="weights"></h2>
  <table id="weights"></table>
  <h2 data-t="limits"></h2>
  <p class="note" data-t="limits_text"></p>
  <h2 data-t="sources"></h2>
  <p class="attr" data-t="sources_text"></p>
  </section>
</aside>
<div id="map"><div class="caption" id="caption"><b data-t="caption_title"></b><span data-t="caption_src"></span></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="ui.js?v=0.7.0"></script>
<script src="app.js?v=0.7.0"></script>
</body>
</html>
