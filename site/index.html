<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZudRisk</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --ink: #1d2433; --muted: #5b6475; --line: #d9dde5; --bg: #f6f7f9; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); }
  body { display: grid; grid-template-columns: 340px 1fr; grid-template-rows: auto 1fr; height: 100vh; }
  header { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: #fff; }
  header h1 { margin: 0; font-size: 18px; }
  header .sub { color: var(--muted); font-size: 14px; flex: 1; }
  header select { font: inherit; padding: 3px 6px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
  header button { font: inherit; padding: 4px 10px; border: 1px solid var(--line); background: #fff; border-radius: 6px; cursor: pointer; }
  aside { overflow-y: auto; padding: 14px 16px; background: #fff; border-right: 1px solid var(--line); }
  aside h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 18px 0 8px; }
  aside h2:first-child { margin-top: 0; }
  #map { height: 100%; }
  .legend div { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
  .legend i { width: 18px; height: 14px; border: 1px solid #999; display: inline-block; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  td { padding: 3px 0; border-bottom: 1px solid #eef0f3; }
  td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  .banner { margin: 0 0 12px; padding: 8px 10px; border-radius: 6px; background: #fff4d6; border: 1px solid #f0c860; font-size: 14px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  header .seg button { border: 0; border-radius: 0; }
  header .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .chip { width: 11px; height: 11px; border: 1px solid #999; display: inline-block; margin-right: 6px; vertical-align: -1px; }
  .aimags tr { cursor: pointer; }
  .aimags tr:hover td, .aimags tr:focus td { background: #f1f3f7; }
  .aimags tr:focus { outline: 2px solid #3b6fd8; outline-offset: -2px; }
  .note, .attr { font-size: 13px; color: var(--muted); }
  .leaflet-popup-content { font-size: 14px; }
  @media (max-width: 760px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto 55vh auto; height: auto; }
    aside { border-right: 0; order: 3; }
    #map { height: 55vh; }
  }
</style>
</head>
<body>
<header>
  <h1 data-t="title"></h1>
  <span class="sub" data-t="subtitle"></span>
  <div class="seg" id="level" role="group"><button type="button" data-level="soum" aria-pressed="true"></button><button type="button" data-level="aimag" aria-pressed="false"></button></div>
  <label><span data-t="winter"></span> <select id="winter"></select></label>
  <button id="lang" type="button">EN</button>
</header>
<aside>
  <p class="banner" id="banner" hidden></p>
  <h2 data-t="legend"></h2>
  <div class="legend" id="legend"></div>
  <h2 data-t="aimags"></h2>
  <table id="aimags" class="aimags"></table>
  <h2 id="validation_h"></h2>
  <table id="validation"></table>
  <p class="note" id="unit_note"></p>
  <p class="note" data-t="validation_note"></p>
  <h2 data-t="pooled"></h2>
  <table id="pooled"></table>
  <h2 data-t="stages"></h2>
  <table id="stages"></table>
  <h2 data-t="limits"></h2>
  <p class="note" data-t="limits_text"></p>
  <h2 data-t="sources"></h2>
  <p class="attr" data-t="sources_text"></p>
</aside>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
